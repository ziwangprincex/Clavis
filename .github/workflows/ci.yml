name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  build:
    # The oldest Ubuntu the AppImage is built on; it also has webkit2gtk-4.1.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      # Tauri 2 system dependencies (webkit2gtk 4.1).
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Test release guards
        run: python -m unittest discover -s tools -p "test_*.py"

      - name: Validate release metadata
        run: python tools/check_release.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The .cwl command library is not committed (see .gitignore), so it must be
      # fetched before anything that reads it: `tauri.conf.json` lists
      # `resources/cwl/*` as a bundle resource, and the corpus test asserts
      # against the real files rather than skipping.
      - name: Fetch LaTeX command library (.cwl)
        run: node tools/fetch-cwl.mjs

      # NOTE: the frontend must be built first. `tauri::generate_context!()`
      # requires `web/dist` to exist, so `cargo check`/`cargo test` fail on a
      # clean checkout until `vite build` has produced it.
      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build

      - name: Rust check
        run: cargo check --locked --all-targets

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Compile Rust tests
        run: cargo test --locked --no-run

      - name: Rust tests
        timeout-minutes: 15
        run: cargo test --locked -- --test-threads=1 --nocapture
