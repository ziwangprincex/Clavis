[workspace]

[package]
name = "clavis"
version = "1.0.9"
description = "A native typesetting key for Markdown, LaTeX & Typst — with live preview"
edition = "2021"
rust-version = "1.92"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = ["dialog-ask", "dialog-confirm", "dialog-message", "dialog-open", "dialog-save", "process-relaunch", "updater", "window-start-dragging", "window-minimize", "window-maximize", "window-unmaximize", "window-close"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
typst = "0.15.1"
typst-syntax = "0.15.1"
typst-svg = "0.15.1"
typst-pdf = "0.15.1"
typst-layout = "0.15.1"
typst-utils = "0.15.1"
fontdb = "0.23.0"
typst-assets = { version = "0.15.1", features = ["fonts"] }
chrono = "0.4"
parking_lot = "0.12"
once_cell = "1"
tempfile = "3"
which = "6"
base64 = "0.22"
tokio = { version = "1", features = ["process", "io-util", "rt", "macros", "time", "sync"] }
regex = "1"
uuid = { version = "1", features = ["v4"] }
memmap2 = "0.9.10"
rusqlite = { version = "0.32", features = ["bundled"] }
ttf-parser = "0.25.1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Controls"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"       # Optimize for binary size (lowers memory footprint)
lto = true            # Link-time optimization (whole program analysis)
codegen-units = 1     # Maximizes LTO effectiveness
panic = "abort"       # Removes panic unwinding infrastructure
strip = true          # Removes debug symbols
